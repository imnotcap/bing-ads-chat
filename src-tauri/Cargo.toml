[package]
name = "bing-ads-chat"
version = "0.1.0"
description = "Bing Ads Chat – chat-assistent til Microsoft Advertising"
authors = ["Bing Ads Chat"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bing_ads_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows Credential Manager on Windows, Keychain on macOS (each feature only compiles on its platform).
keyring = { version = "3", features = ["windows-native", "apple-native"] }
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
