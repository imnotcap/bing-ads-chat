# The installer (XavierOS-Setup.exe): a step-by-step guide in the app's own layout
# that runs the signed NSIS installer silently and opens the app afterwards.
# The NSIS installer is embedded at build time (BAC_SETUP_PAYLOAD, see build.rs).
[package]
name = "bing-ads-chat-setup"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
