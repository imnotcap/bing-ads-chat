# Builds Bing Ads Chat for Windows on every push and – on the main branch – publishes
# it to Cloudflare, where installed apps pick it up as an in-app update (same setup
# as Inventarland). See docs/RELEASE.md.
#
# Every build gets its own version: <major>.<minor> from tauri.conf.json + the run
# number (scripts/set-version.mjs), so each release is newer than the last.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  – the updater signing key (signs the updates)
#   CLOUDFLARE_API_TOKEN       – API token for YOUR Cloudflare account ("Edit Cloudflare Workers"
#                                template). The account and its workers.dev address are found
#                                from the token (scripts/resolve-site.mjs).
# Without them the build still runs; it just isn't signed or published.
name: Build Windows app

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  # Queue instead of cancelling, so every build finishes (the newest one publishes last).
  cancel-in-progress: false

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (types, tests)
        run: pnpm check

      - name: Set version
        id: version
        run: node scripts/set-version.mjs ${{ github.run_number }}

      - name: Find the Cloudflare address
        id: site
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN og/eller TAURI_SIGNING_PRIVATE_KEY mangler – bygger uden automatiske opdateringer og udgiver ikke til Cloudflare (se docs/RELEASE.md)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/resolve-site.mjs
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        id: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ "${{ steps.site.outputs.release }}" = "true" ]; then
            # Signed build with the updater pointed at the Cloudflare address.
            pnpm tauri build --config src-tauri/tauri.release.conf.json
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            pnpm tauri build
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out release
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/Bing-Ads-Chat-Setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi out/Bing-Ads-Chat.msi
          cp src-tauri/target/release/BingAdsChat.exe out/Bing-Ads-Chat-portable.exe
          # Installer + updater signature for the Cloudflare release.
          cp src-tauri/target/release/bundle/nsis/*-setup.exe* release/
          ls -la out release

      - uses: actions/upload-artifact@v7
        with:
          name: Bing-Ads-Chat-Windows
          path: out/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.signed == 'true'
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 14

      # Backup copy on GitHub. Needs "Read and write permissions" under Settings → Actions → General.
      - name: Publish "Seneste build" on GitHub
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest --yes --cleanup-tag || true
          gh release create build-latest out/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Seneste build ${{ steps.version.outputs.version }} (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Automatisk Windows-build af \`${GITHUB_REF_NAME}\` ($GITHUB_SHA). Den officielle download-side er Cloudflare – se README."

  publish:
    name: Publish to Cloudflare
    needs: build
    # Only signed builds of the main branch become updates for installed apps.
    if: needs.build.outputs.signed == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release

      - name: Publish update feed + download page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          node scripts/resolve-site.mjs
          node scripts/publish.mjs release
