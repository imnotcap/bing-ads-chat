# Builds XavierOS for Windows on every push and – on the main branch – publishes
# it to Cloudflare, where installed apps pick it up as an in-app update (same setup
# as Inventarland). See docs/RELEASE.md.
#
# Every build gets its own version: <major>.<minor> from tauri.conf.json + the run
# number (scripts/set-version.mjs), so each release is newer than the last.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  – XavierOS's own updater signing key (no password)
#   CLOUDFLARE_API_TOKEN       – API token for YOUR Cloudflare account ("Edit Cloudflare Workers"
#                                template). The account and its workers.dev address are found
#                                from the token (scripts/resolve-site.mjs).
# Without them the build still runs; it just isn't signed or published.
# For signing in (accounts in the app, see cloudflare/src/workspace.ts):
#   MS_CLIENT_ID               – Application (client) ID of the Microsoft Entra app registration;
#                                built into the app and given to the Cloudflare Worker
# Optional:
#   MS_DEVELOPER_TOKEN         – Microsoft Advertising developer token (pre-filled when someone
#                                connects the shared Microsoft Advertising account)
name: Build Windows app

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  # Queue instead of cancelling, so every build finishes (the newest one publishes last).
  cancel-in-progress: false

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            installer -> ../src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (types, tests)
        run: pnpm check

      - name: Set version
        id: version
        run: node scripts/set-version.mjs ${{ github.run_number }}

      - name: Find the Cloudflare address
        id: site
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN og/eller TAURI_SIGNING_PRIVATE_KEY mangler – bygger uden automatiske opdateringer og udgiver ikke til Cloudflare (se docs/RELEASE.md)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/resolve-site.mjs
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app
        id: build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VITE_MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          VITE_MS_DEVELOPER_TOKEN: ${{ secrets.MS_DEVELOPER_TOKEN }}
          # Where shared planning boards live (the Worker's /api/teams); set by resolve-site.mjs.
          VITE_SITE_URL: ${{ env.BING_ADS_CHAT_SITE_URL }}
        run: |
          if [ "${{ steps.site.outputs.release }}" = "true" ]; then
            # Signed build with the updater pointed at the Cloudflare address.
            pnpm tauri build --config src-tauri/tauri.release.conf.json
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            pnpm tauri build
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # The themed installer (installer/): its own window around the NSIS installer.
      - name: Build themed installer
        shell: bash
        run: |
          export BAC_SETUP_PAYLOAD="$(cygpath -w "$(ls "$PWD"/src-tauri/target/release/bundle/nsis/*-setup.exe)")"
          export BAC_VERSION="${{ steps.version.outputs.version }}"
          CARGO_TARGET_DIR=src-tauri/target cargo build --release --manifest-path installer/Cargo.toml

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out release
          cp src-tauri/target/release/bing-ads-chat-setup.exe out/XavierOS-Setup.exe
          cp src-tauri/target/release/bing-ads-chat-setup.exe release/XavierOS-Installer.exe
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/XavierOS-Setup-klassisk.exe
          cp src-tauri/target/release/bundle/msi/*.msi out/XavierOS.msi
          cp src-tauri/target/release/XavierOS.exe out/XavierOS-portable.exe
          # Installer + updater signature for the Cloudflare release.
          cp src-tauri/target/release/bundle/nsis/*-setup.exe* release/
          ls -la out release

      - uses: actions/upload-artifact@v7
        with:
          name: XavierOS-Windows
          path: out/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.signed == 'true'
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 14

      # Backup copy on GitHub. Needs "Read and write permissions" under Settings → Actions → General.
      - name: Publish "Seneste build" on GitHub
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest --yes --cleanup-tag || true
          gh release create build-latest out/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Seneste build ${{ steps.version.outputs.version }} (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Automatisk Windows-build af \`${GITHUB_REF_NAME}\` ($GITHUB_SHA). Den officielle download-side er Cloudflare – se README."

  publish:
    name: Publish to Cloudflare
    needs: build
    # Only signed builds of the main branch become updates for installed apps.
    if: needs.build.outputs.signed == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release

      # Separate steps: the address exported to GITHUB_ENV is only visible in later steps.
      - name: Find the Cloudflare address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/resolve-site.mjs

      - name: Publish update feed + download page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: node scripts/publish.mjs release
