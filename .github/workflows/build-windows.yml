# Builds Bing Ads Chat for Windows on every push. The files are uploaded as the
# artifact "Bing-Ads-Chat-Windows" (Actions → run → Artifacts) and, when the repo
# allows workflows to write, also published as the pre-release "Seneste build" (tag: build-latest):
#   - Bing-Ads-Chat-Setup.exe   (installer, recommended)
#   - Bing-Ads-Chat-portable.exe (runs without installation – needs WebView2, which Windows 10/11 has)
#   - Bing-Ads-Chat.msi
name: Build Windows app

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  # Queue instead of cancelling, so every build finishes (the newest one publishes last).
  cancel-in-progress: false

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (types, tests)
        run: pnpm check

      - name: Build app
        run: pnpm tauri build

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/Bing-Ads-Chat-Setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi out/Bing-Ads-Chat.msi
          cp src-tauri/target/release/BingAdsChat.exe out/Bing-Ads-Chat-portable.exe
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: Bing-Ads-Chat-Windows
          path: out/
          if-no-files-found: error
          retention-days: 30

      # Needs "Read and write permissions" under Settings → Actions → General → Workflow permissions.
      # Without it the files are still available as the build artifact above.
      - name: Publish "Seneste build"
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete build-latest --yes --cleanup-tag || true
          gh release create build-latest out/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Seneste build (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Automatisk Windows-build af \`${GITHUB_REF_NAME}\` ($GITHUB_SHA). Hent **Bing-Ads-Chat-Setup.exe** for at installere, eller **Bing-Ads-Chat-portable.exe** for at køre uden installation."
